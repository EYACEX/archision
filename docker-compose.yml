# Local development: database + Redis only. Run the server and client with npm (see README).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: propview
      POSTGRES_USER: propview
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
