<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PropView Agents</title>
    <style>
      :root { --bg: #0f1115; --panel: #161a20; --line: #2a2e36; --text: #e6e8eb; --muted: #9aa1ab;
              --green: #3fae6a; --amber: #e0a030; --red: #d64545; --blue: #5b9bd5; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
      button, input, select { font: inherit; color: inherit; }
      button { padding: 6px 12px; background: #1a1d23; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
      button:hover:not(:disabled) { border-color: #4a505c; background: #22262e; }
      button:disabled { opacity: .45; cursor: default; }
      button.primary { background: #234a33; border-color: #2f6b47; }
      button.danger { border-color: #6b2f2f; }
      input, select { padding: 7px 10px; background: #1a1d23; border: 1px solid var(--line); border-radius: 6px; }
      a { color: var(--blue); }
      .muted { color: var(--muted); }
      .error { color: #ff8a8a; }

      #login { max-width: 340px; margin: 12vh auto; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
      #login h1 { margin: 0 0 16px; font-size: 20px; }
      #login label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
      #login input { width: 100%; }
      #login button { width: 100%; margin-top: 16px; }

      header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 16px; }
      header .spacer { flex: 1; }
      nav { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
      nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 12px; white-space: nowrap; }
      nav button.active { border-bottom-color: var(--green); }
      .badge { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--amber); color: #000; font-size: 12px; text-align: center; }
      main { padding: 16px; }

      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: top; }
      th { color: var(--muted); font-weight: 500; font-size: 13px; background: var(--panel); position: sticky; top: 0; }
      tr:last-child td { border-bottom: 0; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; text-transform: capitalize; }
      .pill.available { background: rgba(63,174,106,.2); color: #7fd6a0; }
      .pill.reserved { background: rgba(224,160,48,.2); color: #f0c46b; }
      .pill.sold { background: rgba(214,69,69,.2); color: #f08a8a; }
      .pill.open { background: rgba(224,160,48,.2); color: #f0c46b; }
      .pill.contacted { background: rgba(91,155,213,.2); color: #9cc6ec; }
      .pill.dismissed { background: #2a2e36; color: var(--muted); }
      .actions { display: flex; gap: 6px; }
      .actions button { padding: 3px 9px; font-size: 13px; }
      .flash { animation: flash 1.2s ease-out; }
      @keyframes flash { from { background: rgba(224,160,48,.25); } to { background: transparent; } }
      .history { padding: 6px 10px 10px; font-size: 13px; color: var(--muted); white-space: normal; }

      .card { padding: 16px; margin-bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
      .card h2 { margin: 0 0 8px; font-size: 15px; }
      .summary { display: flex; flex-wrap: wrap; gap: 16px; margin: 8px 0; }
      .up { color: #f08a8a; } .down { color: #7fd6a0; }
      .secret { font-family: ui-monospace, monospace; padding: 2px 6px; background: #0b0d10; border: 1px solid var(--line); border-radius: 4px; user-select: all; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <form id="login" hidden>
      <h1>PropView · Agents</h1>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="primary" type="submit">Sign in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
    <div id="app" hidden></div>
    <script type="module" src="/src/agent/main.ts"></script>
  </body>
</html>
